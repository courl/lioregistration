name: Bun

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4name: 
      - uses: oven-sh/setup-bun@v2 

      - run: bun install 
      - run: bun run check
      - run: bun run build
