[package]
name = "lioregistration2"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lio"
path = "app/main.rs"

[dependencies]
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "entity-registry", "schema-sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version="10.4.0", features=["rust_crypto"] }
config = "0.15.23"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie", "query"] }
time = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
argon2 = "0.5"
dashmap = "6"
clap = { version="4", features = ["derive"] }
strsim = "0.11"
mrml = { version = "6.0.1", features = ["parse", "render"] }
pulldown-cmark = "0.13.4"
# Default features minus `dkim`, which is unused and pulls in mail-auth and a vulnerable zip.
mail-send = { version = "0.6.1", default-features = false, features = ["digest-md5", "cram-md5", "builder", "aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
base64 = "0.23.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
unicode-normalization = "0.1.25"
